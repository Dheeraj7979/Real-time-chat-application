
services:
  backend:
    build: ./backend
    container_name: chat-app-backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - MONGO_URI=mongodb://database:27017/college_db
      - REDIS_URL=redis://cache:6379
    depends_on:
      - database
      - cache


  database:
    image: mongo
    container_name: chata-app-db
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db 
    
  cache:
    image: redis:alpine
    container_name: chat-app-cache
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data/cache

volumes:
  redis-data:
  mongo-data: